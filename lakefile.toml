name = "leanllm"
version = "0.2.0"
defaultTargets = ["leanllm"]
testDriver = "«leanllm-tests»"

[[require]]
name = "leanhttp"
git = "https://github.com/theoriclabs/leanhttp"
rev = "v0.6.0"

[[lean_lib]]
name = "Leanllm"

[[lean_exe]]
name = "leanllm"
root = "Main"

[[lean_lib]]
name = "LeanllmTests"
roots = ["LeanllmTests.Baseline", "LeanllmTests.Golden", "LeanllmTests.Structured"]

[[lean_exe]]
name = "leanllm-tests"
root = "LeanllmTests"
