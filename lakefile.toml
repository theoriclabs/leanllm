name = "leanllm"
version = "0.2.0"
defaultTargets = ["leanllm"]
# `lake test` runs the offline test suite; «» is needed because the name contains a hyphen.
testDriver = "«leanllm-tests»"

[[require]]
name = "leanhttp"
git = "https://github.com/theoriclabs/leanhttp"
rev = "v0.6.0"

[[lean_lib]]
name = "Leanllm"

[[lean_exe]]
name = "leanllm"
root = "Main"

[[lean_exe]]
name = "leanllm-tests"
root = "LeanllmTests"
